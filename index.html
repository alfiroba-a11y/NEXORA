<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXORA — Sign in</title><link rel="stylesheet" href="landing.css">
</head>
<body>
  <main class="entry-shell">
    <section class="brand-panel"><div class="brand"><i>↗</i>NEXORA</div><div class="pitch"><h1>Trade focused.<br>Stay in control.</h1><p>One workspace for binary volatility markets, account controls, and trade activity.</p></div><div class="figures"><span><b>500K+</b>Traders</span><span><b>10</b>Markets</span><span><b>24/7</b>Access</span></div></section>
    <section class="auth-panel"><button class="theme-toggle" id="entryTheme" aria-label="Toggle theme">☼</button><form id="entryForm"><h2 id="entryTitle">Welcome to NEXORA</h2><p id="entryLead">Sign in to access your trading dashboard.</p><label>Email<input id="entryEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="entryPassword" type="password" autocomplete="current-password" minlength="12" required placeholder="Enter your password"></label><p class="form-error" id="entryError" role="alert"></p><button class="continue" id="entrySubmit" type="submit">Sign in <span>→</span></button><p class="switch" id="entrySwitch">New to NEXORA? <button type="button" id="modeToggle">Create an account</button></p></form></section>
  </main>
  <script src="landing.js"></script>
</body>
</html>
