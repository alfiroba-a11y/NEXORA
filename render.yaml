services:
  - type: web
    name: nexora-trading-platform
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: nexora-db
    plan: basic-256mb
    databaseName: nexora
    user: nexora
